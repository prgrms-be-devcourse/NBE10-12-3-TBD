openapi: 3.0.3
info:
  title: NBE10-12-2-Team1 API
  description: |
    오늘 뭐먹지 SNS 서비스 REST API 문서입니다.

    ## 인증
    인증이 필요한 API는 요청 헤더에 Bearer 토큰을 포함해야 합니다.
    ```
    Authorization: Bearer {accessToken}
    ```
  version: 1.0.0

servers:
  - url: https://api.whattoeats.app
    description: Production server
  - url: http://localhost:8080
    description: Local server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "상세한 에러 메시지 내용"

tags:
  - name: Auth
    description: 🔐 인증 및 토큰 관리
  - name: Users
    description: 👤 회원 관리
  - name: Follow
    description: 👥 관계 관리
  - name: Restaurants
    description: 🍽️ 식당 관리 및 검색
  - name: Feeds
    description: 📝 피드 게시글 관리
  - name: Comments
    description: 💬 댓글 관리
  - name: Lists
    description: 📋 맛집 리스트
  - name: Notifications
    description: 🔔 알림 관리

paths:

  # ─────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────
  /api/v1/auth/reissue:
    post:
      tags: [Auth]
      summary: 토큰 재발급
      description: Refresh Token을 이용해 새로운 Access Token과 Refresh Token을 발급합니다.
      security: []
      responses:
        "200":
          description: 토큰 재발급 성공
          content:
            application/json:
              example:
                success: true
                data: null
        "401":
          description: Refresh Token 만료 / 위조 / 불일치 / 연결된 사용자 없음
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_REFRESH_TOKEN"
                  message: "유효하지 않은 Refresh Token입니다. 다시 로그인해주세요."
        "500":
          description: 서버 오류 / Access Token 재발급 실패
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: 일반 회원가입
      description: 이메일(로그인id)와 비밀번호로 회원가입합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password, nickname]
              properties:
                loginId:
                  type: string
                  format: email
                  example: "foodie@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "password123!"
                nickname:
                  type: string
                  maxLength: 20
                  example: "푸디보이"
      responses:
        "200":
          description: 회원가입 성공
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  nickname: "푸디보이"
                  profileImage: null
                  email: "foodie@example.com"
                  provider: "LOCAL"
                  createdAt: "2026-07-03T10:00:00"
                message: "회원가입이 완료되었습니다."
        "400":
          description: 필수 필드 누락 / 이메일 형식 오류 / 비밀번호 8자 미만 / 닉네임 20자 초과
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "입력값이 올바르지 않습니다."
        "409":
          description: 이미 사용 중인 이메일 (DUPLICATE_EMAIL)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "DUPLICATE_EMAIL"
                  message: "이미 사용 중인 이메일입니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 일반 로그인
      description: 이메일(로그인id)와 비밀번호로 로그인합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId:
                  type: string
                  format: email
                  example: "foodie@example.com"
                password:
                  type: string
                  example: "password123!"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  nickname: "푸디보이"
                  profileImage: null
                  email: "foodie@example.com"
                  provider: "LOCAL"
                  createdAt: "2026-07-03T10:00:00"
                message: "로그인에 성공했습니다."
        "400":
          description: 필수 필드 누락 / 이메일 형식 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "입력값이 올바르지 않습니다."
        "401":
          description: 이메일 또는 비밀번호 불일치 (INVALID_CREDENTIALS)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_CREDENTIALS"
                  message: "이메일 또는 비밀번호가 올바르지 않습니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: Access Token을 무효화하여 로그아웃합니다. 카카오 및 일반 로그인 공통으로 사용합니다.
      responses:
        "200":
          description: 로그아웃 성공
          content:
            application/json:
              example:
                success: true
                data: null
                message: "로그아웃되었습니다."
        "401":
          description: 인증되지 않은 사용자
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "인증이 만료되었습니다. 다시 로그인해주세요."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  # ─────────────────────────────────────────────
  # Users
  # ─────────────────────────────────────────────
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: 프로필 조회
      description: 사용자 ID로 프로필 정보를 조회합니다. 본인 조회 시 isOwnProfile=true를 반환하며, 타인 조회 시 isOwnProfile=false와 isFollowing 여부를 함께 반환합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 조회할 사용자 ID
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: 프로필 조회 성공
          content:
            application/json:
              example:
                id: 1
                nickname: "푸디보이"
                profileImage: "https://k.kakaocdn.net/.../img.jpg"
                email: "foodie@kakao.com"
                provider: "KAKAO"
                createdAt: "2026-06-20T10:00:00"
                isOwnProfile: true
                isFollowing: false
        "401":
          description: 인증 토큰 없음 또는 만료
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "인증이 만료되었습니다. 다시 로그인해주세요."
        "404":
          description: 존재하지 않는 사용자 (USER_NOT_FOUND)
          content:
            application/json:
              example:
                status: 404
                message: "User not found: 1"
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: 내 프로필 조회
      description: 로그인한 사용자의 프로필 정보를 조회합니다.
      responses:
        "200":
          description: 내 프로필 조회 성공
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  nickname: "푸디보이"
                  profileImage: "https://k.kakaocdn.net/.../img.jpg"
                  email: "foodie@kakao.com"
                  provider: "KAKAO"
                  createdAt: "2026-06-20T10:00:00"
                  isOwnProfile: true
                  isFollowing: false
        "401":
          description: 인증 토큰 없음 또는 만료
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "인증이 만료되었습니다. 다시 로그인해주세요."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

    patch:
      tags: [Users]
      summary: 내 프로필 수정
      description: |
        본인 프로필의 닉네임, 이메일, 비밀번호를 수정합니다.
        LOCAL 사용자는 이메일/비밀번호 변경이 가능하고, KAKAO 사용자는 닉네임만 수정 가능합니다.
        프로필 이미지는 `/api/v1/users/me/image`를 사용합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: "새로운닉네임"
                email:
                  type: string
                  format: email
                  nullable: true
                  example: "new@example.com"
                currentPassword:
                  type: string
                  nullable: true
                  example: "oldPassword123!"
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 20
                  nullable: true
                  example: "newPassword123!"
      responses:
        "200":
          description: 프로필 수정 성공
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  nickname: "새로운닉네임"
                  profileImage: "https://example.com/profile.jpg"
                  email: "new@example.com"
                  provider: "LOCAL"
                  createdAt: "2026-07-03T10:00:00"
                  isOwnProfile: true
                  isFollowing: false
        "400":
          description: 입력값 오류 / 카카오 사용자 비밀번호 변경 / 현재 비밀번호 불일치
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "입력값이 올바르지 않습니다."
        "401":
          description: 인증 토큰 없음 또는 만료
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "인증이 만료되었습니다. 다시 로그인해주세요."
        "409":
          description: 이미 사용 중인 닉네임
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "DUPLICATE_NICKNAME"
                  message: "이미 사용 중인 닉네임입니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/users/me/image:
    patch:
      tags: [Users]
      summary: 프로필 이미지 변경
      description: |
        본인 프로필 이미지를 즉시 업로드하여 변경합니다.
        jpg, jpeg, png 파일만 허용합니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 프로필 이미지 파일 (jpg/jpeg/png)
      responses:
        "200":
          description: 프로필 이미지 변경 성공
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  nickname: "푸디보이"
                  profileImage: "https://example.com/new-profile.jpg"
                  email: "foodie@kakao.com"
                  provider: "KAKAO"
                  createdAt: "2026-06-20T10:00:00"
                  isOwnProfile: true
                  isFollowing: false
        "400":
          description: 이미지 누락 / 허용되지 않는 확장자
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "jpg, jpeg, png 파일만 업로드 가능합니다."
        "401":
          description: 인증 토큰 없음 또는 만료
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "인증이 만료되었습니다. 다시 로그인해주세요."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  # ─────────────────────────────────────────────
  # Follow
  # ─────────────────────────────────────────────
  /api/v1/users/{id}/follow:
    post:
      tags: [Follow]
      summary: 팔로우
      description: 특정 사용자를 팔로우합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 팔로우할 사용자 ID
          schema:
            type: integer
            example: 2
      responses:
        "200":
          description: 팔로우 성공
          content:
            application/json:
              example:
                success: true
                data:
                  followId: 99
                  followerId: 1
                  followingId: 2
                  createdAt: "2026-06-18T18:00:00"
        "400":
          description: 자기 자신 팔로우 시도 (SELF_FOLLOW_NOT_ALLOWED)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "SELF_FOLLOW_NOT_ALLOWED"
                  message: "자기 자신을 팔로우할 수 없습니다."
        "404":
          description: 존재하지 않는 유저 (USER_NOT_FOUND)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "USER_NOT_FOUND"
                  message: "존재하지 않는 사용자입니다."
        "409":
          description: 이미 팔로우 중 (ALREADY_FOLLOWING)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "ALREADY_FOLLOWING"
                  message: "이미 팔로우 중인 사용자입니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

    delete:
      tags: [Follow]
      summary: 언팔로우
      description: 특정 사용자의 팔로우를 취소합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 언팔로우할 사용자 ID
          schema:
            type: integer
            example: 2
      responses:
        "200":
          description: 언팔로우 성공
          content:
            application/json:
              example:
                success: true
                data: null
        "401":
          description: 로그인하지 않은 사용자
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "UNAUTHORIZED"
                  message: "로그인 후 이용해주세요."
        "404":
          description: 팔로우 관계가 존재하지 않음 (FOLLOW_NOT_FOUND)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "FOLLOW_NOT_FOUND"
                  message: "팔로우 관계가 존재하지 않습니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/users/{id}/followings:
    get:
      tags: [Follow]
      summary: 팔로잉 목록 조회
      description: 특정 사용자가 팔로우하는 목록을 페이지네이션으로 조회합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 사용자 ID
          schema:
            type: integer
            example: 1
        - name: page
          in: query
          required: false
          description: 페이지 번호 (기본값 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기 (기본값 20)
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 팔로잉 목록 조회 성공
          content:
            application/json:
              example:
                success: true
                data:
                  followings:
                    - userId: 2
                      nickname: "서교동김푸디"
                      profileImage: "https://k.kakaocdn.net/.../profile2.jpg"
                      isFollowedByMe: true
                  totalPages: 1
                  totalElements: 3
        "400":
          description: userId 형식 오류 또는 page/size가 0 이하 (INVALID_INPUT_VALUE / INVALID_PAGE_SIZE)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "입력값이 올바르지 않습니다."
        "404":
          description: 존재하지 않는 유저 (USER_NOT_FOUND)
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "USER_NOT_FOUND"
                  message: "존재하지 않는 사용자입니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/users/{id}/followers:
    get:
      tags: [Follow]
