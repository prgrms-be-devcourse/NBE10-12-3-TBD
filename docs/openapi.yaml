  # ─────────────────────────────────────────────
  /api/v1/restaurants/search:
    get:
      tags: [Restaurants]
      summary: 식당 검색 (카카오맵 API 연동)
      description: 키워드로 식당을 검색합니다. 인증 불필요.
      security: []
      parameters:
        - name: query
          in: query
          required: true
          description: 검색 키워드 (예 - 을지로 삼겹살)
          schema:
            type: string
            example: "을지로 삼겹살"
        - name: x
          in: query
          required: false
          description: 경도 (Longitude)
          schema:
            type: number
            format: double
            example: 126.9780
        - name: "y"
          in: query
          required: false
          description: 위도 (Latitude)
          schema:
            type: number
            format: double
            example: 37.5665
        - name: radius
          in: query
          required: false
          description: 반경 미터 단위 (최대 20000)
          schema:
            type: integer
            maximum: 20000
            example: 1000
      responses:
        "200":
          description: 식당 검색 성공
          content:
            application/json:
              example:
                success: true
                data:
                  restaurants:
                    - id: 1
                      kakaoPlaceId: "12345678"
                      name: "을지삼겹"
                      category: "한식"
                      address: "서울 중구 을지로3가 12-3"
                      roadAddress: "서울 중구 을지로 123길 4"
                      region1: "서울"
                      region2: "중구"
                      region3: "을지로3가"
                      region4: null
                      phone: "02-123-4567"
                      lat: 37.5665
                      lng: 126.9780
        "400":
          description: 필수 파라미터 query 누락 또는 radius 20000 초과
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_REQUEST"
                  message: "검색어(query)는 필수입니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."
        "502":
          description: 카카오맵 API 통신 실패
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "BAD_GATEWAY"
                  message: "카카오맵 서비스와의 통신에 실패했습니다. 잠시 후 다시 시도해주세요."

  /api/v1/restaurants/recommend:
    post:
      tags: [Restaurants]
      summary: 카카오 후보 기반 맛집 추천
      description: 카카오 장소 검색 결과 후보를 분위기·카테고리·정렬·제외 조건으로 필터링해 추천합니다. 인증 불필요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidates]
              properties:
                candidates:
                  type: array
                  minItems: 1
                  description: 카카오 장소 검색 결과 후보
                  items:
                    type: object
                    required: [kakaoPlaceId, name, address, lat, lng]
                    properties:
                      kakaoPlaceId:
                        type: string
                      name:
                        type: string
                      categoryName:
                        type: string
                        nullable: true
                      address:
                        type: string
                      roadAddress:
                        type: string
                        nullable: true
                      region1:
                        type: string
                        nullable: true
                      region2:
                        type: string
                        nullable: true
                      region3:
                        type: string
                        nullable: true
                      region4:
                        type: string
                        nullable: true
                      phone:
                        type: string
                        nullable: true
                      lat:
                        type: number
                        format: double
                      lng:
                        type: number
                        format: double
                category:
                  type: string
                  nullable: true
                  enum: [KOREAN, WESTERN, CHINESE, JAPANESE, ASIAN, CAFE, SNACK, CHICKEN, FASTFOOD, BAR, BUFFET, SHABU, FUSION, ETC]
                mood:
                  type: string
                  nullable: true
                  enum: [DATE, FRIENDS, FAMILY, SOLO, GROUP, NIGHT]
                sort:
                  type: string
                  default: RANDOM
                  enum: [RANDOM, DISTANCE]
                lat:
                  type: number
                  format: double
                  nullable: true
                  description: 거리순 정렬 기준 위도
                lng:
                  type: number
                  format: double
                  nullable: true
                  description: 거리순 정렬 기준 경도
                exclude:
                  type: array
                  items:
                    type: string
                  description: 이미 추천한 카카오 장소 ID 목록
            example:
              candidates:
                - kakaoPlaceId: "12345678"
                  name: "을지삼겹"
                  categoryName: "음식점 > 한식 > 육류,고기"
                  address: "서울 중구 을지로3가 12-3"
                  roadAddress: "서울 중구 을지로 123길 4"
                  region1: "서울"
                  region2: "중구"
                  region3: "을지로3가"
                  region4: null
                  phone: "02-123-4567"
                  lat: 37.5665
                  lng: 126.978
              category: KOREAN
              mood: DATE
              sort: RANDOM
              lat: 37.5665
              lng: 126.978
              exclude: []
      responses:
        "200":
          description: 맛집 추천 성공
          content:
            application/json:
              example:
                success: true
                data:
                  recommendations:
                    - kakaoPlaceId: "12345678"
                      category: KOREAN
                      categoryLabel: "한식"
                      distanceMeter: 120
                      name: "을지삼겹"
                      categoryName: "음식점 > 한식 > 육류,고기"
        "400":
          description: 후보·좌표·정렬 값이 올바르지 않음
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INVALID_INPUT_VALUE"
                  message: "추천 요청값이 올바르지 않습니다."
        "404":
          description: 조건에 맞는 식당 없음
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "RESTAURANT_NOT_FOUND"
                  message: "조건에 맞는 식당이 없습니다."
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                data: null
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요."

